name: t1_face_tree
view: netherite-procedural
goal: Put the crosshair on a tree trunk.
goal_cu: |
  Find a nearby tree and pan the camera until the crosshair rests on a log
  block of its trunk. Turn around with mouse_move if no tree is in view.
  Do not mine or move; stop once the crosshair is on the trunk.
seeds: [11, 22, 33]
init: {yaw: [-180, 180], pitch: [-5, 5]}
max_lines: 4
max_ticks: 800
max_turns: 6
max_ticks_per_turn: 100
settle_ticks: 2
decision_cost: 0.0
snapshot_radius: 32
initial_state:
  player: {health: 20, food: 20}
  spawn:
    hazard_clearance: 1
    constraints:
      - {block: log, min_distance: 4, max_distance: 12}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
success:
  type: crosshair_block
  blocks: [log]
  max_dist: 16
  reward: 1.0

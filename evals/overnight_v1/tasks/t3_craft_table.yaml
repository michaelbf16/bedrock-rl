name: t3_craft_table
view: netherite-procedural
goal: Craft a crafting table from the planks in your inventory.
goal_cu: |
  Craft a crafting table. You have planks. Press e to open the inventory,
  pick up the planks stack with a left click, right click once on each of
  the four cells of the 2x2 crafting grid, left click the leftover planks
  back to a free slot, then left click the crafting table in the result
  slot to take it.
seeds: [11, 22, 33]
init: {yaw: [-180, 180], pitch: [-5, 5]}
max_lines: 8
max_ticks: 3000
max_turns: 15
max_ticks_per_turn: 200
settle_ticks: 1
decision_cost: 0.0
initial_state:
  player: {health: 20, food: 20, selected_item: planks}
  inventory:
    - {item: planks, count: 8, slot: random_hotbar}
  spawn: {hazard_clearance: 1}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
success:
  type: item_crafted
  item: crafting_table
  reward: 1.0

name: t1_open_inventory
view: netherite-procedural
goal: Open your inventory screen.
goal_cu: |
  Open the player inventory screen by pressing the e key, then stop.
seeds: [11, 22, 33]
init: {yaw: [-180, 180], pitch: [-5, 5]}
max_lines: 2
max_ticks: 120
max_turns: 3
max_ticks_per_turn: 40
settle_ticks: 1
decision_cost: 0.0
initial_state:
  player: {health: 20, food: 20}
  inventory:
    - {item: dirt, count: 32, slot: random_hotbar}
    - {item: torch, count: 16, slot: random_hotbar}
  spawn: {hazard_clearance: 1}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
success:
  type: container_opened
  kind: player
  reward: 1.0

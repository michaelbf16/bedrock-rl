name: farm_one_log_sdg
goal: Find a nearby tree, harvest one natural log, and collect it.
goal_cu: Find a nearby tree, break one natural log block, and collect the dropped log.
seeds: [0]
view: netherite-procedural
init: {yaw: [-180, 180], pitch: [-8, 8]}
max_lines: 12
max_ticks: 12000
max_turns: 80
max_ticks_per_turn: 1000
settle_ticks: 2
decision_cost: 0.0
snapshot_radius: 32
initial_state:
  player: {health: 20, food: 20, saturation: 20}
  spawn:
    hazard_clearance: 1
    constraints:
      - {block: log, min_distance: 4, max_distance: 12}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
fail:
  type: any
  of:
    - {type: player_fluid_state, block: lava}
    - {type: vitals_changed, max_health: 19}
  reward: -1.0
success: {type: item_gained, item: log, count: 1, reward: 1.0}

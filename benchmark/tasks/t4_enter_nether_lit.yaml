name: t4_enter_nether_lit
view: netherite-procedural
goal: Light the obsidian portal frame and enter the Nether.
goal_cu: |
  Travel to the Nether. There is a complete obsidian portal frame a few
  blocks ahead of you and flint and steel is already selected. Walk up to
  the frame, aim the crosshair at the inside face of the bottom obsidian
  row, and right click once to ignite the portal. Then walk into the
  purple portal and stand still inside it until you are teleported (about
  four seconds).
seeds: [11, 22, 33]
init: {yaw: [-10, 10], pitch: [-5, 5]}
max_lines: 8
max_ticks: 4000
max_turns: 20
max_ticks_per_turn: 300
settle_ticks: 2
decision_cost: 0.0
initial_state:
  player: {health: 20, food: 20, selected_item: flint_and_steel}
  inventory:
    - {item: flint_and_steel, count: 1, slot: random_hotbar}
  spawn:
    points:
      - {x: 1.0, y: 65, z: 0.5, yaw: 0, pitch: 3}
  blocks:
    - {block: air, x: [-7, 7], y: [65, 73], z: [-7, 7]}
    - {block: stone, x: [-7, 7], y: 64, z: [-7, 7]}
    - {block: obsidian, x: [-1, 2], y: 64, z: 5}
    - {block: obsidian, x: -1, y: [65, 67], z: 5}
    - {block: obsidian, x: 2, y: [65, 67], z: 5}
    - {block: obsidian, x: [-1, 2], y: 68, z: 5}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
fail:
  type: died
  reward: -1.0
success:
  type: dimension_changed
  dimension: -1
  reward: 1.0

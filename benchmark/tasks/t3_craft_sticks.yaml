name: t3_craft_sticks
view: netherite-procedural
goal: Craft sticks from the planks in your inventory.
goal_cu: |
  Craft sticks. You have planks. Press e to open the inventory, pick up the
  planks stack with a left click, right click once on an upper cell of the
  2x2 crafting grid and once on the cell directly below it (two planks in a
  vertical column), left click any leftover planks back to a free slot, then
  left click the sticks in the result slot to take them.
seeds: [11, 22, 33]
init: {yaw: [-180, 180], pitch: [-5, 5]}
max_lines: 8
max_ticks: 3000
max_turns: 15
max_ticks_per_turn: 200
settle_ticks: 1
decision_cost: 0.0
initial_state:
  player: {health: 20, food: 20, selected_item: planks}
  inventory:
    - {item: planks, count: 8, slot: random_hotbar}
  spawn: {hazard_clearance: 1}
  world: {mode: survival, difficulty: normal, weather: clear, time: 1000, mobs: false}
success:
  type: item_crafted
  item: stick
  reward: 1.0
